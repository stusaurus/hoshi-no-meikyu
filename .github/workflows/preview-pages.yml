name: Star Maze preview (unlisted, noindex)
on:
  push:
    branches: [feat/standard-web-prototype]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static preview
        run: |
          mkdir -p dist
          cp index.html style.css game.js cpu.js dist/
          touch dist/.nojekyll
          printf '%s\n' 'User-agent: *' 'Disallow: /' > dist/robots.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
