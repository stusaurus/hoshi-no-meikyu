name: Web prototype smoke test
on:
  push:
    branches: [main, feat/standard-web-prototype]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check game.js
      - name: Validate game setup, secrets and flag blocking
        run: node tests/smoke.test.js
