name: Prototype smoke tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check game.js
      - run: node tests/smoke.cjs
      - run: node tests/interactions.cjs
      - run: node tests/cpu.cjs
