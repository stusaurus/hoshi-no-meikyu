name: Preview Star Maze on GitHub Pages
on:
  push:
    branches:
      - feat/standard-web-prototype
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: star-maze-pages
  cancel-in-progress: true
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: star-maze-preview
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble preview
        run: |
          mkdir -p preview
          cp index.html style.css game.js cpu.js preview/
          touch preview/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > preview/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
